name: CI check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: All 100 landing pages present
        run: |
          missing=0
          for i in $(seq -w 1 100); do
            if [ ! -d "site-$i" ] || [ ! -f "site-$i/index.html" ]; then
              echo "MISSING: site-$i/index.html"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "OK: all 100 sites present"

      - name: Each page well-formed
        run: |
          broken=0
          for d in site-*; do
            if [ ! -f "$d/index.html" ]; then continue; fi
            if ! grep -q '</html>' "$d/index.html"; then
              echo "NO </html>: $d"
              broken=1
            fi
          done
          if [ "$broken" -ne 0 ]; then exit 1; fi
          echo "OK: all pages closed"

      - name: Root index links to all sites
        run: |
          python - <<'EOF'
          import re, sys
          html = open('index.html', encoding='utf-8').read()
          missing = []
          for i in range(1, 101):
              name = f'site-{i:03d}'
              if f'{name}/' not in html:
                  missing.append(name)
          if missing:
              print('Root index missing links:', ', '.join(missing))
              sys.exit(1)
          print('OK: root index links to all 100 sites')
          EOF

      - name: Validate sitemap.xml
        run: |
          python - <<'EOF'
          import xml.etree.ElementTree as ET, sys
          try:
              ET.parse('sitemap.xml')
          except Exception as e:
              print('BAD sitemap.xml:', e)
              sys.exit(1)
          print('OK: sitemap.xml valid')
          EOF
